<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, viewport-fit=cover, user-scalable=no" />
  <!-- "Thêm vào MH chính" trên iPad: chạy toàn màn hình như app -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Lâu đài" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="theme-color" content="#fde7f3" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  <title>Lâu đài công chúa của Hà An</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #fde7f3; --ink: #4a2c4a; --accent: #ff9600; --success: #58cc02; --magic: #8b5cf6; --pink: #ff5fb4;
      --ice: #a7e8ff; --card: #fffaf0; --shadow: 0 6px 0 rgba(74, 44, 74, .22); --gold: #ffc233;
    }
    /* máy tính bảng: không phóng to, không chọn chữ, không menu giữ lâu, không kéo trang / kéo để tải lại (src/tablet.ts chặn thêm) */
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
    [hidden] { display: none !important; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); overscroll-behavior: none; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    body { position: fixed; inset: 0; font-family: 'Baloo 2', 'Nunito', system-ui, sans-serif; color: var(--ink); touch-action: none; }
    button { touch-action: manipulation; -webkit-user-select: none; user-select: none; }
    img { -webkit-user-drag: none; }
    #app, #app canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

    .big {
      appearance: none; border: 5px solid var(--ink); border-radius: 999px; background: #fff;
      width: 88px; height: 88px; font: inherit; font-size: 44px; line-height: 1; cursor: pointer;
      box-shadow: var(--shadow); display: grid; place-items: center; color: var(--ink); padding: 0;
      transition: transform .1s ease, box-shadow .1s ease;
    }
    .big:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(74, 44, 74, .2); }

    /* HUD */
    #hud { position: fixed; top: max(14px, env(safe-area-inset-top)); left: max(16px, env(safe-area-inset-left)); right: max(16px, env(safe-area-inset-right)); display: flex; justify-content: space-between; align-items: center; z-index: 6; pointer-events: none; }
    #hud > * { pointer-events: auto; }
    /* nút chạm ≥ 2 cm trên iPad (~100 px CSS) */
    #home { width: 104px; height: 104px; font-size: 52px; background: #fff3fb; }
    #say { width: 104px; height: 104px; font-size: 50px; }
    .pill { background: var(--card); border: 4px solid var(--ink); border-radius: 999px; padding: 4px 22px; font-size: 32px; font-weight: 800; box-shadow: var(--shadow); white-space: nowrap; }
    #hud-right { display: flex; gap: 12px; align-items: center; }

    /* tên phòng */
    #banner { position: fixed; top: calc(max(14px, env(safe-area-inset-top)) + 124px); left: 50%; transform: translate(-50%, -30px) scale(.9); z-index: 7; pointer-events: none;
      font-size: clamp(40px, 6.5vw, 76px); font-weight: 800; color: #fff; -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill;
      text-shadow: 0 6px 0 rgba(74,44,74,.25); opacity: 0; transition: opacity .5s, transform .5s; white-space: nowrap; }
    #banner.show { opacity: 1; transform: translate(-50%, 0) scale(1); }

    /* băng giá quanh mép màn khi công chúa còn đóng băng */
    #frost { position: fixed; inset: 0; pointer-events: none; z-index: 2; opacity: 0; transition: opacity 1.2s ease;
      background: radial-gradient(ellipse at center, rgba(255,255,255,0) 58%, rgba(170,225,255,.45) 86%, rgba(215,240,255,.85) 100%); }

    /* bảng thử thách: dưới đáy (tay bé với tới, không che mặt nhân vật) */
    #panel {
      position: fixed; bottom: max(14px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); z-index: 8; width: min(980px, 96vw);
      background: rgba(255, 250, 240, .95); border: 5px solid var(--ink); border-radius: 32px; padding: 12px 20px 18px;
      box-shadow: var(--shadow), 0 0 0 8px rgba(255,255,255,.35); display: flex; flex-direction: column; align-items: center; gap: 12px;
      animation: rise .35s ease;
    }
    @keyframes rise { from { transform: translate(-50%, 40px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
    #panel-top { display: flex; align-items: center; justify-content: center; gap: 16px; min-height: 64px; flex-wrap: wrap; }
    #panel-bottom { display: flex; align-items: center; justify-content: center; gap: 22px; flex-wrap: wrap; }
    #repeat { width: 104px; height: 104px; font-size: 48px; }
    #word-emoji { font-size: 76px; line-height: 1; }
    #word { font-size: clamp(52px, 8vw, 92px); font-weight: 800; letter-spacing: .06em; display: flex; gap: .02em; line-height: 1.05; }
    #word span { transition: color .15s, transform .15s; display: inline-block; }
    #word span.lit { color: var(--accent); transform: translateY(-6px) scale(1.12); }
    #word span.blank { color: var(--pink); border-bottom: 6px dashed var(--pink); line-height: .9; min-width: .55em; text-align: center; }
    #word.whole span { color: var(--success); animation: bounce .5s ease; }
    @keyframes bounce { 0% { transform: scale(1); } 40% { transform: scale(1.18) rotate(-3deg); } 100% { transform: scale(1); } }
    .bump { animation: bump .45s ease; }
    @keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.25); } 100% { transform: scale(1); } }

    /* toán: hàng đồ vật (trên) + phép tính bằng chữ số (dưới, cạnh 3 nút số) — src/ui.ts showMath */
    #math { display: flex; align-items: center; justify-content: center; }
    .mobjs { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; max-width: 820px; }
    .mgroup { display: flex; gap: 2px; padding: 4px 10px; border-radius: 22px; background: rgba(167, 232, 255, .35); border: 3px dashed rgba(74,44,74,.18); }
    .mgroup.gb { background: rgba(255, 194, 51, .28); }
    .mgroup.gc { background: rgba(88, 204, 2, .14); }
    .mitem { font-size: 50px; line-height: 1.05; display: inline-block; position: relative; transition: transform .5s cubic-bezier(.3,1.6,.5,1), opacity .5s; filter: drop-shadow(0 3px 0 rgba(74,44,74,.18)); }
    .mitem.small { font-size: 38px; }
    .mitem.new { animation: popIn .5s cubic-bezier(.3,1.6,.5,1) both; }
    @keyframes popIn { from { transform: scale(.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .mitem.bag { font-size: 44px; transition: opacity .3s, width .3s; }
    .mitem.bag.open { opacity: 0; width: 0; overflow: hidden; }
    .mitem.ghost { opacity: 0; width: 0; overflow: hidden; }
    .mitem.ghost.shown { opacity: .55; width: auto; overflow: visible; outline: 3px dashed var(--magic); outline-offset: -2px; border-radius: 14px; }
    /* trừ: vật bị bớt bay / rơi / tan / chạy đi, để lại dấu gạch */
    .mitem.gone::after { content: '✖'; position: absolute; inset: 0; display: grid; place-items: center; color: #e5484d; font-size: 40px; opacity: 0; transition: opacity .3s .4s; }
    .mitem.gone.went { opacity: .3; }
    .mitem.gone.went::after { opacity: 1; }
    .mitem.gone.went.away-fly { transform: translate(18px, -26px) rotate(18deg) scale(.75); }
    .mitem.gone.went.away-fall { transform: translateY(22px) rotate(-25deg) scale(.8); }
    .mitem.gone.went.away-melt { transform: scaleY(.35) translateY(40px); }
    .mitem.gone.went.away-run { transform: translateX(34px) scale(.8); }
    /* đếm cùng: nảy lên + số trên đầu */
    .mitem.hop { animation: hop .45s ease; }
    @keyframes hop { 0%,100% { transform: translateY(0); } 45% { transform: translateY(-26px) scale(1.15); } }
    .mitem.counted::before { content: attr(data-n); position: absolute; left: 50%; top: -30px; transform: translateX(-50%); font-size: 26px; font-weight: 800; color: #fff;
      background: var(--accent); border: 3px solid var(--ink); border-radius: 999px; min-width: 38px; line-height: 30px; text-align: center; }
    #math-eq { display: flex; align-items: center; gap: 10px; font-size: 64px; font-weight: 800; line-height: 1; }
    .mnum { min-width: .7em; text-align: center; }
    .mop { font-size: 52px; font-weight: 800; color: var(--magic); padding: 0 2px; }
    .mq { display: inline-grid; place-items: center; min-width: 84px; height: 84px; border: 5px dashed var(--pink); border-radius: 22px; color: var(--pink); background: #fff; }
    .mq.solved { border-style: solid; border-color: #3f9500; color: #fff; background: var(--success); animation: bump .45s ease; }
    .opt.num { font-size: 84px; color: #5b3aa8; }
    .opt.letter { font-size: 84px; }
    #options { display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; }
    .opt {
      appearance: none; border: 6px solid var(--ink); border-radius: 28px; background: #fff; color: var(--ink);
      width: 136px; height: 136px; font: inherit; font-size: 78px; font-weight: 800; box-shadow: var(--shadow); cursor: pointer;
      display: grid; place-items: center; transition: transform .15s, opacity .25s; padding: 0; line-height: 1;
    }
    .opt:active { transform: translateY(4px); }
    .opt.correct { background: var(--success); color: #fff; border-color: #3f9500; pointer-events: none; }
    .opt.gone { opacity: 0; transform: scale(.4); pointer-events: none; }
    .opt.hint { animation: hint .7s ease-in-out infinite; border-color: var(--accent); }
    @keyframes hint { 0%,100% { transform: scale(1); } 50% { transform: scale(1.1); box-shadow: 0 0 0 12px rgba(255,150,0,.4); } }
    .wobble { animation: wobble .45s ease; }
    @keyframes wobble { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } 75% { transform: rotate(-4deg); } }

    /* nút lớn cuối phòng */
    #actions { position: fixed; left: 50%; bottom: max(26px, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 8; display: flex; gap: 22px; flex-wrap: wrap; justify-content: center; width: max-content; max-width: 96vw; }
    .cta { appearance: none; border: 6px solid var(--ink); border-radius: 999px; background: var(--gold); color: var(--ink); font: inherit; font-weight: 800;
      font-size: clamp(30px, 4.2vw, 44px); padding: 14px 34px; min-height: 96px; box-shadow: var(--shadow); cursor: pointer; display: flex; align-items: center; gap: 12px; white-space: nowrap;
      animation: pulse 1.4s ease-in-out infinite; }
    .cta.alt { background: #fff; animation: none; }
    .cta:active { transform: translateY(4px); }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }

    #toast { position: fixed; top: 30%; left: 50%; transform: translate(-50%, -50%); z-index: 9; pointer-events: none; font-size: clamp(48px, 8vw, 96px); font-weight: 800; color: #fff; -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 0 6px 0 rgba(74,44,74,.25); opacity: 0; transition: opacity .25s, transform .25s; white-space: nowrap; }
    #toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }

    #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 20; overflow: hidden; }
    #confetti i { position: absolute; top: -24px; width: 14px; height: 22px; border-radius: 4px; animation: fall linear forwards; }
    @keyframes fall { to { transform: translateY(110vh) rotate(720deg); opacity: .7; } }

    /* chuyển cảnh */
    #fade { position: fixed; inset: 0; z-index: 30; background: radial-gradient(circle at 50% 40%, #fff6fb, #f7d4ec); opacity: 0; pointer-events: none; transition: opacity .4s ease; display: grid; place-items: center; }
    #fade.on { opacity: 1; pointer-events: auto; }
    #fade .loader { font-size: 96px; opacity: 0; transition: opacity .3s; animation: spin 1.6s ease-in-out infinite; }
    #fade.loading .loader { opacity: 1; }
    @keyframes spin { 0% { transform: rotate(-12deg) scale(1); } 50% { transform: rotate(12deg) scale(1.12); } 100% { transform: rotate(-12deg) scale(1); } }

    /* màn bắt đầu */
    .overlay { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; transition: opacity .5s ease; }
    .overlay.hide { opacity: 0; pointer-events: none; }
    #start { background: radial-gradient(circle at 50% 35%, #fff 0%, #ffe3f3 45%, #e9d8ff 100%); }
    #start .inner { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; padding: 20px; position: relative; }
    #start h1 { margin: 0; font-size: clamp(44px, 8vw, 96px); line-height: 1; color: #fff; -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill; text-shadow: 0 8px 0 rgba(74,44,74,.22); }
    #start h2 { margin: 0 0 8px; font-size: clamp(22px, 3.2vw, 36px); color: var(--ink); opacity: .8; }
    #start .castle { font-size: clamp(100px, 17vw, 180px); line-height: 1; filter: drop-shadow(0 10px 0 rgba(74,44,74,.18)); animation: float 3s ease-in-out infinite; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
    #start-btn { width: 180px; height: 180px; font-size: 92px; background: var(--magic); border-color: #5b3aa8; opacity: .5; }
    #start-btn.ready { opacity: 1; animation: pulse 1.4s ease-in-out infinite; }
    #start .sparkles { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    #start .sparkles i { position: absolute; font-style: normal; animation: twinkle 2.4s ease-in-out infinite; }
    @keyframes twinkle { 0%,100% { opacity: .2; transform: scale(.7); } 50% { opacity: 1; transform: scale(1.1); } }

    /* gia đình cổ vũ: bong bóng trượt vào từ mép phải (src/family.ts) */
    #family { position: fixed; right: max(14px, env(safe-area-inset-right)); top: calc(max(14px, env(safe-area-inset-top)) + 118px); z-index: 12; display: flex; flex-direction: column; gap: 10px; align-items: flex-end; pointer-events: none; }
    .fam-card { --fam: #ff5fb4; display: flex; align-items: center; gap: 14px; background: #fffaf0; border: 5px solid var(--fam); border-radius: 999px 40px 40px 999px; padding: 8px 26px 8px 8px;
      box-shadow: var(--shadow), 0 0 0 6px rgba(255,255,255,.55); max-width: min(520px, 80vw); animation: famIn .5s cubic-bezier(.2,1.5,.4,1) both; position: relative; }
    .fam-card::after { content: '💖'; position: absolute; left: -8px; top: -12px; font-size: 32px; animation: famHeart 1.2s ease-in-out infinite; }
    .fam-card.out { animation: famOut .45s ease-in both; }
    .fam-ava { width: 112px; height: 112px; flex: none; border-radius: 50%; border: 5px solid var(--fam); background: radial-gradient(circle at 50% 35%, #fff, #ffe6f4); display: grid; place-items: center; font-size: 72px; line-height: 1; overflow: hidden; animation: famBob .9s ease-in-out infinite alternate; }
    .fam-ava img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .fam-body { display: flex; flex-direction: column; min-width: 0; }
    .fam-name { font-size: 34px; font-weight: 800; color: var(--fam); line-height: 1.05; -webkit-text-stroke: 1px rgba(74,44,74,.25); }
    .fam-say { font-size: 30px; font-weight: 800; line-height: 1.15; color: var(--ink); }
    .fam-card.mini { padding: 5px 18px 5px 5px; gap: 10px; }
    .fam-card.mini::after { display: none; }
    .fam-card.mini .fam-ava { width: 72px; height: 72px; font-size: 46px; border-width: 4px; }
    .fam-card.mini .fam-name { font-size: 24px; }
    .fam-card.mini .fam-say { font-size: 22px; }
    @keyframes famIn { from { transform: translateX(120%) rotate(6deg); opacity: 0; } to { transform: translateX(0) rotate(0); opacity: 1; } }
    @keyframes famOut { to { transform: translateX(120%); opacity: 0; } }
    @keyframes famBob { from { transform: translateY(-3px) rotate(-4deg); } to { transform: translateY(3px) rotate(4deg); } }
    @keyframes famHeart { 0%,100% { transform: scale(.85); } 50% { transform: scale(1.15); } }

    /* debug */
    #debug { position: fixed; right: 10px; bottom: 10px; z-index: 50; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; font: 13px/1.35 ui-monospace, monospace; }
    #debug .row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    #debug button { font: inherit; background: #fff; border: 2px solid var(--ink); border-radius: 8px; padding: 4px 8px; cursor: pointer; }
    #debug pre { margin: 0; max-width: min(560px, 90vw); max-height: 40vh; overflow: auto; background: rgba(255,255,255,.95); border: 2px solid var(--ink); border-radius: 8px; padding: 6px 8px; white-space: pre-wrap; }
    #debug pre.ok { border-color: #3f9500; }
    #debug pre.bad { border-color: #d7263d; }

    /* phụ đề có nhãn người nói (src/talk.ts): giữa nút 🏰 và cụm ⭐ 🔊 trên cùng, không che mặt nhân vật */
    #subtitle { position: fixed; z-index: 11; top: max(14px, env(safe-area-inset-top));
      left: calc(max(16px, env(safe-area-inset-left)) + 120px); right: calc(max(16px, env(safe-area-inset-right)) + 290px);
      display: flex; justify-content: center; pointer-events: none; }
    #subtitle > * { flex: none; }
    #subtitle.in { animation: subIn .3s ease both; }
    @keyframes subIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: none; } }
    #subtitle { --sc: #2f9df5; }
    #subtitle .sub-ava { width: 76px; height: 76px; border-radius: 50%; border: 5px solid var(--sc); background: radial-gradient(circle at 50% 35%, #fff, #e8f4ff);
      display: grid; place-items: center; font-size: 46px; overflow: hidden; box-shadow: var(--shadow); position: relative; z-index: 1; margin-right: -18px; align-self: center; }
    #subtitle .sub-ava img { width: 100%; height: 100%; object-fit: cover; display: block; }
    #subtitle .sub-body { flex: 0 1 auto; min-width: 0; max-width: 100%; background: rgba(255, 250, 240, .96); border: 4px solid var(--sc); border-radius: 26px; padding: 8px 18px 8px 30px;
      box-shadow: var(--shadow); font-size: 21px; line-height: 1.22; font-weight: 600; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    #subtitle .sub-body b { color: var(--sc); font-weight: 800; margin-right: 6px; }

    /* màn dọc: nhắc xoay ngang (game dựng cho iPad nằm ngang) */
    #rotate { position: fixed; inset: 0; z-index: 100; display: none; place-items: center; text-align: center; padding: 24px;
      background: radial-gradient(circle at 50% 35%, #fff 0%, #ffe3f3 45%, #e9d8ff 100%); }
    #rotate .phone { font-size: 120px; display: inline-block; animation: turn 2.2s ease-in-out infinite; }
    #rotate p { margin: 18px 0 0; font-size: 40px; font-weight: 800; color: #fff; -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; }
    @keyframes turn { 0%, 25% { transform: rotate(0); } 55%, 100% { transform: rotate(-90deg); } }
    @media (orientation: portrait) { #rotate { display: grid; } }

    @media (max-width: 720px), (max-height: 620px) {
      .opt { width: 108px; height: 108px; font-size: 62px; border-radius: 22px; }
      #home, #say, #repeat { width: 96px; height: 96px; font-size: 44px; }
      .pill { font-size: 26px; }
      #family { top: calc(max(14px, env(safe-area-inset-top)) + 104px); }
      .fam-ava { width: 84px; height: 84px; font-size: 54px; }
      .fam-name { font-size: 26px; } .fam-say { font-size: 22px; }
      .fam-card.mini .fam-ava { width: 56px; height: 56px; font-size: 36px; }
      #word-emoji { font-size: 60px; }
      .mitem { font-size: 40px; }
      #math-eq { font-size: 52px; }
      .mq { min-width: 70px; height: 70px; }
      #subtitle { left: calc(max(16px, env(safe-area-inset-left)) + 110px); right: calc(max(16px, env(safe-area-inset-right)) + 250px); }
      #subtitle .sub-body { font-size: 18px; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="frost"></div>

  <div id="hud" hidden>
    <button id="home" class="big" aria-label="Về đại sảnh">🏰</button>
    <div id="hud-right">
      <div class="pill" id="stars">⭐ 0/11</div>
      <button id="say" class="big" aria-label="Nghe lại">🔊</button>
    </div>
  </div>
  <div id="banner"></div>

  <div id="panel" hidden>
    <div id="panel-top">
      <button id="repeat" class="big" aria-label="Nghe lại">🔊</button>
      <div id="word-emoji" hidden></div>
      <div id="word" hidden></div>
      <div id="math" hidden></div>
    </div>
    <div id="panel-bottom">
      <div id="math-eq" hidden></div>
      <div id="options"></div>
    </div>
  </div>

  <div id="actions" hidden>
    <button id="btn-again" class="cta alt" hidden>🔁 Chơi lại</button>
    <button id="btn-hall" class="cta">🏰 Về đại sảnh</button>
  </div>

  <div id="toast"></div>
  <div id="confetti"></div>
  <div id="fade" class="on"><div class="loader">👑</div></div>

  <div id="start" class="overlay">
    <div class="sparkles"></div>
    <div class="inner">
      <div class="castle">🏰</div>
      <h1>Lâu đài công chúa</h1>
